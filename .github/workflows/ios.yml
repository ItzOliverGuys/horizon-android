# Builds an unsigned Horizon.ipa for TrollStore. No Apple account, certificate or
# provisioning profile is involved: TrollStore fakesigns the artifact on install.
name: iOS IPA
on:
  push:
    branches: [ios]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      # The generated engine tables need Minecraft's jars and a Java 25 runtime;
      # they are Horizon's own output, so the IPA can carry them.
      - uses: actions/cache@v4
        with:
          path: |
            .local/android
            .local/horizon-client
          key: tables-${{ hashFiles('research-lock.json') }}
      - run: python3 tools/android_prepare.py --tables-only
      - run: python3 -c "import sys; sys.path.insert(0, 'tools'); import android_build; print(android_build.engine_data(public=True))"
      - run: sh tools/ios_ipa.sh
      - name: Report sizes
        run: |
          ls -lh build/ios/Horizon.ipa .local/android/engine-data-generated.zip
          du -sh .local/android .local/horizon-client
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ipa
          path: build/ios/Horizon.ipa
          if-no-files-found: error
